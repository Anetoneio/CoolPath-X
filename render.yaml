services:
  - type: web
    name: coolpath-engine
    runtime: python
    plan: free
    buildCommand: pip install -r engine/requirements.txt
    startCommand: uvicorn engine.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_MODE
        value: real
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
