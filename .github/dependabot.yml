version: 2
updates:
  # Python dependencies for the engine
  - package-ecosystem: "pip"
    directory: "/engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-updates:
        patterns: ["*"]
    # NOTE: This entry only updates dependencies listed in requirements.txt.
    # requirements-dev.txt is **not** covered and must be updated manually.

  # JavaScript / Node dependencies for the web UI
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-updates:
        patterns: ["*"]

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gha-updates:
        patterns: ["*"]

# Dependabot PRs are never auto‑merged; maintainers must review and merge them manually.
